<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beamer PDF to SCORM</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f6f8;margin:0;color:#1f2937}
.wrap{max-width:760px;margin:48px auto;padding:24px}
.card{background:white;border-radius:16px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.08)}
h1{margin-top:0}.row{margin:16px 0}label{display:block;font-weight:700;margin-bottom:7px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:10px;background:white}
button{border:0;border-radius:10px;padding:12px 18px;background:#111827;color:white;font-weight:700;cursor:pointer}.muted{color:#6b7280}.status{margin-top:18px;padding:12px;border-radius:10px;background:#f3f4f6;display:none}a.btn{display:inline-block;text-decoration:none;background:#047857;color:white;padding:11px 16px;border-radius:10px;font-weight:700}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>PDF Beamer → SCORM Annotatable</h1>
<p class="muted">SCORM 2004 dengan Pen, Highlighter, Eraser, Undo, dan penyimpanan anotasi lokal.</p>
<form id="form">
<div class="row"><label>File PDF Beamer</label><input type="file" name="pdf" accept="application/pdf" required></div>
<div class="row"><label>Judul Materi</label><input type="text" name="title" value="Materi Perkuliahan"></div>
<div class="row"><label>SCORM Identifier</label><input type="text" name="identifier" value="beamer-scorm"></div>
<div class="row"><label>Kualitas Gambar Slide</label><select name="quality"><option value="1920" selected>Full HD - 1920 px</option><option value="2560">QHD - 2560 px</option><option value="3840">4K - 3840 px</option></select><div class="muted" style="margin-top:6px;font-size:13px">Semakin tinggi kualitas, ukuran paket SCORM semakin besar.</div></div>
<button type="submit">Buat Paket SCORM</button>
</form>
<div id="status" class="status"></div>
</div></div>
<script>
const f=document.getElementById('form'), s=document.getElementById('status');
f.addEventListener('submit', async e=>{e.preventDefault();s.style.display='block';s.textContent='Memproses PDF dan membuat paket SCORM...';
 const r=await fetch('/convert',{method:'POST',body:new FormData(f)}); const j=await r.json();
 if(!j.ok){s.textContent=j.error||'Gagal';return;} s.innerHTML=`Selesai. ${j.slides} slide dirender pada lebar ${j.render_width}px. <a class="btn" href="${j.download}">Download SCORM ZIP</a>`;
});
</script>
</body></html>
